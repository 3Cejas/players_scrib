<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual QA · Narración de apertura</title>
    <link rel="stylesheet" href="../../game/css/show-narration.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>
    <script src="../../game/js/domains/show-narration.js"></script>
    <script>
        const query = new URLSearchParams(location.search);
        const role = query.get("role") === "muse" ? "muse" : "spectator";
        const position = Number(query.get("position")) || 0;
        const handlers = new Map();
        const socketRef = {
            connected: false,
            on(name, handler) { handlers.set(name, handler); },
            emit() {}
        };
        const controller = window.ScribShowNarration.createController({
            windowRef: window,
            documentRef: document,
            socketRef,
            role
        });
        controller.handleState({
            activa: true,
            session_id: "visual-qa",
            secuencia: 1,
            posicion_segundos: position,
            inicio_ts: Date.now() - (position * 1000),
            configuracion: {
                pre_roll_segundos: 5,
                duracion_audio_segundos: 80.013,
                audio_url: "/game/media/narracion-show.mp3",
                slide_url: "/game/media/narracion-final.png"
            }
        });
    </script>
</body>
</html>
