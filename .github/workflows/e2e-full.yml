name: E2E Full

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - "release/**"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      server_hooks_ready: ${{ steps.probe.outputs.server_hooks_ready }}
    steps:
      - name: Probe server_scrib master for E2E hooks
        id: probe
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/3Cejas/server_scrib.git server_scrib_probe
          if grep -q "scrib_test:get_state" server_scrib_probe/server.js; then
            echo "server_hooks_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_hooks_ready=false" >> "$GITHUB_OUTPUT"
          fi

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      SCRIB_SERVER_REMOTE_URL: https://github.com/3Cejas/server_scrib.git
      SCRIB_SERVER_REMOTE_BRANCH: master
    steps:
      - name: Checkout players_scrib
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install players_scrib dependencies
        run: npm ci

      - name: Run players_scrib unit tests
        run: npm run test:unit

      - name: Run visual E2E suite
        run: npm run test:e2e:visual

      - name: Publish E2E visual summary
        if: always()
        run: |
          if [ -f ".e2e-artifacts/latest-run-summary.json" ]; then
            node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('.e2e-artifacts/latest-run-summary.json','utf8')); const lines=['## E2E Visual Summary','', '- Total: ' + s.total, '- Passed: ' + s.passed, '- Failed: ' + s.failures, '- Suite: ' + s.suite, '- Server source: ' + s.serverSource, '', '### Specs']; for (const r of s.results) { lines.push('- ' + r.status.toUpperCase() + ' ' + r.name + ' (' + r.durationMs + 'ms)' + (r.error ? ' - ' + r.error : '')); } fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');"
          else
            echo "No E2E summary file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-artifacts-${{ github.run_id }}
          path: .e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  full:
    needs: preflight
    if: needs.preflight.outputs.server_hooks_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      SCRIB_SERVER_REMOTE_URL: https://github.com/3Cejas/server_scrib.git
      SCRIB_SERVER_REMOTE_BRANCH: master
    steps:
      - name: Checkout players_scrib
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install players_scrib dependencies
        run: npm ci

      - name: Run players_scrib unit tests
        run: npm run test:unit

      - name: Run full E2E suite
        run: npm run test:e2e

      - name: Publish E2E full summary
        if: always()
        run: |
          if [ -f ".e2e-artifacts/latest-run-summary.json" ]; then
            node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('.e2e-artifacts/latest-run-summary.json','utf8')); const lines=['## E2E Full Summary','', '- Total: ' + s.total, '- Passed: ' + s.passed, '- Failed: ' + s.failures, '- Suite: ' + s.suite, '- Server source: ' + s.serverSource, '', '### Specs']; for (const r of s.results) { lines.push('- ' + r.status.toUpperCase() + ' ' + r.name + ' (' + r.durationMs + 'ms)' + (r.error ? ' - ' + r.error : '')); } fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');"
          else
            echo "No E2E summary file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-artifacts-${{ github.run_id }}
          path: .e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  full-skipped:
    needs: preflight
    if: needs.preflight.outputs.server_hooks_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Skipping full E2E run because server_scrib/master does not yet expose the required test hooks."
