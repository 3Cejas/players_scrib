<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCRB · Técnica</title>
    <link rel="icon" href="../../img/logo.png" type="image/png" />
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#f4fbff;font-family:monospace;background:linear-gradient(90deg,rgba(0,181,255,.2),rgba(3,7,14,.9) 45% 55%,rgba(255,67,67,.2)),#02040a}.panel{width:min(38rem,100%);padding:clamp(22px,5vw,44px);border:1px solid rgba(255,209,102,.55);border-radius:24px;background:rgba(5,10,20,.92);box-shadow:0 0 40px rgba(255,209,102,.13);text-align:center}h1{letter-spacing:.12em;text-shadow:-.07em 0 #ff5050,.07em 0 #46f0ff}p{opacity:.75;line-height:1.6}.loader{width:3rem;height:3rem;margin:1.5rem auto 0;border:.22rem solid rgba(70,240,255,.18);border-top-color:#46f0ff;border-right-color:#ff646f;border-radius:50%;animation:girar .7s linear infinite}@keyframes girar{to{transform:rotate(1turn)}}
    </style>
</head>
<body>
    <main class="panel">
        <h1>🎛️ TÉCNICA</h1>
        <p>Abriendo la consola técnica…</p>
        <div class="loader" aria-hidden="true"></div>
    </main>
    <script>
        let player = 1;
        try {
            player = Number(localStorage.getItem("scrib_technician_selected_player_v1")) === 2 ? 2 : 1;
        } catch (error) {
            player = 1;
        }
        window.location.replace(`../actors/source/index.html?role=technician&player=${player}`);
    </script>
</body>
</html>
