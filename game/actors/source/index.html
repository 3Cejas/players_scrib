<html lang="es">

<head>
    <link  rel="icon"   href="../../../img/logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRB - Intérpretes 🎭</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" type="text/css" href="./css/publico.css?v=20260505f">
    <link rel="stylesheet" type="text/css" href="../../css/level-transition.css?v=20260823a">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../../config.js?v=20260827b"></script>
    <script src="../../js/runtime.js?v=20260424a"></script>
    <script src="../../js/domains/inspiration.js?v=20260504e"></script>
    <script src="../../js/domains/disadvantages.js?v=20260424a"></script>
    <script src="../../js/domains/teleprompter.js?v=20260424a"></script>
    <script src="./js/actions.js?v=20260505c"></script>
    <script src="./js/annotations.js?v=20260505c"></script>
</head>
<body class="page-actors">
        <div id="level_transition" class="level-transition level-transition--compact" aria-hidden="true">
            <div class="level-transition__backdrop" aria-hidden="true"></div>
            <div class="level-transition__rays" aria-hidden="true"></div>
            <div class="level-transition__burst" aria-hidden="true"></div>
            <article class="level-transition__panel" aria-hidden="true">
                <p class="level-transition__eyebrow" data-level-eyebrow>NUEVO NIVEL</p>
                <div class="level-transition__icon-shell" aria-hidden="true">
                    <span class="level-transition__icon" data-level-icon></span>
                </div>
                <h2 class="level-transition__title" data-level-title>NIVEL</h2>
                <p class="level-transition__detail" data-level-detail></p>
                <div class="level-transition__meter" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </article>
            <div class="level-transition__scanlines" aria-hidden="true"></div>
        </div>
        <p id="level_transition_status" class="scrib-visually-hidden" role="status" aria-live="assertive" aria-atomic="true"></p>
        <button id="actor_fullscreen_toggle" class="actor-fullscreen-toggle" type="button" data-actor-annotation-ui aria-label="Activar pantalla completa" title="Pantalla completa">&#x1F5A5;&#xFE0F; Pantalla completa</button>
        <div id="contenedor" class="contenedor">
            <div class="container"></div>
            <p><span id="temas" class="temas"></span></p>
            <br>
            <div class="jugador">
                <input disabled id="nombre" class="nombre"></input>
                <br><br>
                <p id="alineador1"></p>
                <div class="actor-annotation-layout">
                    <div class="actor-text-shell">
                        <div contenteditable="false" class="textarea" id="texto"
                        spellcheck="false">
                    </div>
                    </div>
                    <aside id="actor_annotation_margin" class="actor-annotation-margin" data-actor-annotation-ui aria-label="Anotaciones locales del interprete"></aside>
                </div>
                <div id="actor_annotation_toolbar" class="actor-annotation-toolbar" data-actor-annotation-ui role="toolbar" aria-label="Herramientas de anotacion del interprete" hidden>
                    <button type="button" class="actor-annotation-tool actor-annotation-tool--underline" data-annotation-action="underline" aria-label="Subrayar texto">U</button>
                    <button type="button" class="actor-annotation-tool actor-annotation-tool--underline actor-annotation-underline-swatch actor-annotation-underline-swatch--yellow" data-annotation-action="underline" data-underline-color="#ffe95c" aria-label="Subrayar en amarillo">U</button>
                    <button type="button" class="actor-annotation-tool actor-annotation-tool--underline actor-annotation-underline-swatch actor-annotation-underline-swatch--green" data-annotation-action="underline" data-underline-color="#6bff83" aria-label="Subrayar en verde">U</button>
                    <button type="button" class="actor-annotation-tool actor-annotation-swatch actor-annotation-swatch--text" data-annotation-action="color" data-color="#f8f9ff" aria-label="Texto blanco"></button>
                    <button type="button" class="actor-annotation-tool actor-annotation-swatch actor-annotation-swatch--text" data-annotation-action="color" data-color="#46f0ff" aria-label="Texto azul"></button>
                    <button type="button" class="actor-annotation-tool actor-annotation-swatch actor-annotation-swatch--text" data-annotation-action="color" data-color="#ff6b6b" aria-label="Texto rojo"></button>
                    <button type="button" class="actor-annotation-tool" data-annotation-action="note" aria-label="Anotar en margen">N</button>
                    <button type="button" class="actor-annotation-tool actor-annotation-tool--clear" data-annotation-action="clear" aria-label="Quitar marcas">x</button>
                </div>
                <div id="actor_annotation_note_editor" class="actor-annotation-note-editor" data-actor-annotation-ui hidden>
                    <textarea id="actor_annotation_note_input" class="actor-annotation-note-input" rows="3" maxlength="280" placeholder="Nota"></textarea>
                    <div class="actor-annotation-note-editor__actions">
                        <button type="button" id="actor_annotation_note_save" class="actor-annotation-note-editor__button actor-annotation-note-editor__button--save">Guardar</button>
                        <button type="button" id="actor_annotation_note_cancel" class="actor-annotation-note-editor__button">Cancelar</button>
                    </div>
                </div>
                <br><br>
                <div class="tiempo-contenedor">
                    <p id="tiempo" hidden aria-hidden="true"></p>
                </div>
                <div align="center">
                    <div id="metadatos_actor" class="right metadatos-grid metadatos-grid--cabecera marcador-actores marcador-equipo marcador-equipo-1">
                        <div class="meta-item meta-top-left marcador-chip marcador-chip--puntos">
                            <span class="meta-icon">&#x1F58B;&#xFE0F;</span>
                            <div class="meta-copy">
                                <span class="meta-label" data-i18n="score.words_label">Palabras</span>
                                <span id="puntos" class="puntos">0 palabras</span>
                            </div>
                        </div>
                    </div>
                    <section class="niveles">
                        <div class="niveles-scroll">
                            <div class="niveles-linea" role="list" aria-label="Niveles de la partida">
                            <div class="nivel-item nivel-verde" data-modo="letra bendita" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x1F64F;</div>
                                <div class="nivel-texto">
                                    <span>LETRA</span>
                                    <span>BENDITA</span>
                                </div>
                            </div>
                            <div class="nivel-item nivel-rojo" data-modo="letra prohibida" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x1F608;</div>
                                <div class="nivel-texto">
                                    <span>LETRA</span>
                                    <span>MALDITA</span>
                                </div>
                            </div>
                            <div class="nivel-item nivel-azul" data-modo="tertulia" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x1F4AC;</div>
                                <div class="nivel-texto">
                                    <span>TERTULIA</span>
                                </div>
                            </div>
                            <div class="nivel-item nivel-amarillo" data-modo="palabras bonus" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x1F4D6;</div>
                                <div class="nivel-texto">
                                    <span>PALABRA</span>
                                    <span>BENDITA</span>
                                </div>
                            </div>
                            <div class="nivel-item nivel-rosa" data-modo="palabras prohibidas" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x2694;&#xFE0F;</div>
                                <div class="nivel-texto">
                                    <span>PALABRA</span>
                                    <span>MALDITA</span>
                                </div>
                            </div>
                            <div class="nivel-item nivel-naranja" data-modo="frase final" role="listitem">
                                <div class="nivel-icono" aria-hidden="true">&#x1F3C1;</div>
                                <div class="nivel-texto">
                                    <span>FRASE</span>
                                    <span>FINAL</span>
                                </div>
                            </div>
                            </div>
                        </div>
                    </section>
                </div>
                <br>
                <table class="info">
                    <tr>
                            <p id="explicación" class="explicación"></p>
                    </tr>
                        <p id="palabra" class=palabra></p>
                    </tr>
                    <tr>
                        <p id="definicion" class="definicion"></p>
                    </tr>
                </table>
        </div>
        </div>
</body>
<script src="../../dist/socket.io/socket.io.js"></script>
    <script src="../../js/i18n.js?v=20260823a"></script>
<script src="../../js/domains/level-transition.js?v=20260823a"></script>
<script src="./js/socket-events.js?v=20260823a"></script>
</html>
